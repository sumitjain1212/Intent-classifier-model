name: Deploy to kind (EC2)

on:
  workflow_dispatch:          # ← still manually triggerable
    inputs:
      image_tag:
        description: "Docker Hub image tag to deploy (e.g. 42.1)"
        required: false
        default: "latest"

env:
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
  K8S_NAMESPACE:   ${{ vars.K8S_NAMESPACE   || 'intent' }}
  APP_NAME:        ${{ vars.APP_NAME        || 'intent-classifier' }}
  CLUSTER_NAME:    ${{ vars.CLUSTER_NAME    || 'intent-kind' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verify image exists on Docker Hub
        run: |
          IMAGE="${{ env.DOCKERHUB_IMAGE }}:${{ github.event.inputs.image_tag }}"
          echo "Checking image: $IMAGE"
          docker manifest inspect "$IMAGE" || \
            (echo "❌ Image $IMAGE not found on Docker Hub!" && exit 1)

      - name: Pull image on EC2 and roll out the new tag
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.EC2_HOST }}
          username:    ${{ secrets.EC2_USER }}
          key:         ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            export KUBECONFIG=/home/ubuntu/.kube/config
            IMAGE="${{ env.DOCKERHUB_IMAGE }}:${{ github.event.inputs.image_tag }}"

            echo "Pulling $IMAGE from Docker Hub..."
            docker pull "$IMAGE"

            echo "Loading image into kind cluster '${{ env.CLUSTER_NAME }}'..."
            kind load docker-image "$IMAGE" --name "${{ env.CLUSTER_NAME }}"

            echo "Updating Deployment image..."
            kubectl -n "${{ env.K8S_NAMESPACE }}" set image \
              "deployment/${{ env.APP_NAME }}" \
              "${{ env.APP_NAME }}=$IMAGE"

            echo "Waiting for rollout..."
            kubectl -n "${{ env.K8S_NAMESPACE }}" rollout status \
              "deployment/${{ env.APP_NAME }}" --timeout=180s

            echo "✅ Deployment of $IMAGE complete."
