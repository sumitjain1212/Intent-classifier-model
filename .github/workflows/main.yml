name: Build and Push Docker Image

on:
  workflow_dispatch:

permissions:
  actions: write      # ← needed to trigger the deploy workflow via API
  contents: read

env:
  BUILD_NUMBER: "${{ github.run_number }}.${{ github.run_attempt }}"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/intent-classifier:${{ env.BUILD_NUMBER }}
            ${{ secrets.DOCKER_USERNAME }}/intent-classifier:latest

      - name: Trigger deploy workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Triggering deploy for image tag: ${{ env.BUILD_NUMBER }}"
          gh workflow run deploy.yml \
            --ref main \
            --field image_tag=${{ env.BUILD_NUMBER }}
